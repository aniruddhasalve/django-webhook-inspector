[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-webhook-inspector"
version = "0.1.0"
description = "A local webhook inbox for inspecting, replaying, and forwarding HTTP requests"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aniruddha Salve", email = "salveaniruddha180@gmail.com"}]
dependencies = ["Django>=4.2,<6.0", "httpx>=0.27,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.9", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["inspector_app*", "webhook_inspector*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "webhook_inspector.settings"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.ignore = ["RUF012"]
